[tools]
python = "3.14.6"
uv = "0.12.23"
ruff = "0.15.20"
shellcheck = "0.11.0"
bats = "1.13.0"
node = "24.20.0"
jq = "1.8.2"
gitleaks = "8.30.1"
gh = "2.101.0"
"pipx:pytest" = "9.1.1"
"pipx:pre-commit" = "4.6.0"
"pipx:pre-commit-hooks" = "6.0.0"

[tasks.test]
description = "Run every test family (mise-tasks/test/*)"
depends = ["test:*"]

[tasks.lint]
description = "Run every lint family (mise-tasks/lint/*)"
depends = ["lint:*"]

[tasks.fmt]
description = "Format python"
run = "ruff format plugins scripts"

# workbench:code-tasks:begin
[tasks."code:test"]
description = "Run test in every component"
run = [
  "mise run --cd code/claude-code-wrapper test",
  "mise run --cd code/any-mcp test",
  "mise run --cd code/agents-orchestrator test",
  "mise run --cd code/agents-helmfile test",
  "mise run --cd code/agents-web test",
  "mise run --cd code/agents-common test",
  "mise run --cd code/agents-webhook test",
  "mise run --cd code/agents-schedule test",
  "mise run --cd code/agents-matrix-connector test",
  "mise run --cd code/any-mcp-tatara-plugins test",
]

[tasks."code:lint"]
description = "Run lint in every component"
run = [
  "mise run --cd code/claude-code-wrapper lint",
  "mise run --cd code/any-mcp lint",
  "mise run --cd code/agents-orchestrator lint",
  "mise run --cd code/agents-helmfile lint",
  "mise run --cd code/agents-web lint",
  "mise run --cd code/agents-common lint",
  "mise run --cd code/agents-webhook lint",
  "mise run --cd code/agents-schedule lint",
  "mise run --cd code/agents-matrix-connector lint",
  "mise run --cd code/any-mcp-tatara-plugins lint",
]

[tasks."code:fmt"]
description = "Run fmt in every component"
run = [
  "mise run --cd code/claude-code-wrapper fmt",
  "mise run --cd code/any-mcp fmt",
  "mise run --cd code/agents-orchestrator fmt",
  "mise run --cd code/agents-helmfile fmt",
  "mise run --cd code/agents-web fmt",
  "mise run --cd code/agents-common fmt",
  "mise run --cd code/agents-webhook fmt",
  "mise run --cd code/agents-schedule fmt",
  "mise run --cd code/agents-matrix-connector fmt",
  "mise run --cd code/any-mcp-tatara-plugins fmt",
]
# workbench:code-tasks:end
