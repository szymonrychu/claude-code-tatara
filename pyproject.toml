[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["scripts"]
markers = [
    "template: asserts the uninitialised template state; skipped once the workbench is initialised",
    "slow: full green-tree e2e proofs (~48 min); run by `mise run e2e`, deselected from the default suite",
]
